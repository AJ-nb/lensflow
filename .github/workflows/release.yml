name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: lensflow-pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build:extension
      - run: npm run zip
      - run: node scripts/hydrate-release-feed.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/release-artifacts.mjs
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/lensflow-*-chrome.zip
      - run: npm run build:site
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lensflow-*-chrome.zip
            dist/SHA256SUMS.txt
            dist/*.json
          body_path: docs/releases/${{ github.ref_name }}.md
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
