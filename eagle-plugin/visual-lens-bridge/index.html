<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>砚台 · Eagle 工作台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><img class="brand-mark" src="logo.png" alt="砚台 Logo" width="36" height="36"><div><h1>砚台 · Eagle 工作台</h1><p id="libraryLine">等待连接当前图库</p></div></div>
      <div class="top-actions">
        <button id="exportBaseline" class="button secondary" disabled>导出基线</button>
        <button id="exportReport" class="button secondary" disabled>导出结果</button>
        <button id="refresh" class="icon-button" title="重新扫描" aria-label="重新扫描">↻</button>
      </div>
    </header>

    <section class="summary-band" aria-label="图库摘要">
      <div><span>图库条目</span><strong id="totalCount">0</strong></div>
      <div><span>待写入</span><strong id="pendingCount">0</strong></div>
      <div><span>已完成</span><strong id="successCount">0</strong></div>
      <div><span>失败</span><strong id="failureCount">0</strong></div>
      <div class="summary-progress"><span>队列进度</span><strong id="progressText">0%</strong><i><b id="progressBar"></b></i></div>
    </section>

    <section class="control-band">
      <div class="control-copy"><span class="status-dot" id="statusDot"></span><div><strong id="statusTitle">准备扫描</strong><small id="statusDetail">只追加有文件夹或格式证据的标签</small></div></div>
      <div class="queue-actions">
        <label class="batch-size"><span>每批</span><select id="batchSize"><option>10</option><option selected>25</option><option>50</option></select></label>
        <button id="retry" class="button secondary" disabled>重试失败</button>
        <button id="pause" class="button secondary" disabled>暂停</button>
        <button id="start" class="button primary" disabled>开始批处理</button>
      </div>
    </section>

    <section class="mapping-strip">
      <div><strong>文件夹</strong><span>图库/* · 通用阶段</span></div><b>→</b>
      <div><strong>文件格式</strong><span>文件/*</span></div><b>→</b>
      <div><strong>Eagle 标签</strong><span>保留原标签并追加</span></div>
      <p>品类、材料、工艺、零件、AI 来源和产品同款不会由固定词库自动写入。</p>
    </section>

    <section class="workspace">
      <aside class="filters">
        <label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索名称、文件夹或标签"></label>
        <div class="filter-group"><strong>队列状态</strong>
          <button class="filter active" data-status="all"><span>全部</span><b id="filterAll">0</b></button>
          <button class="filter" data-status="pending"><span>待处理</span><b id="filterPending">0</b></button>
          <button class="filter" data-status="success"><span>已完成</span><b id="filterSuccess">0</b></button>
          <button class="filter" data-status="failed"><span>失败</span><b id="filterFailed">0</b></button>
          <button class="filter" data-status="skipped"><span>已跳过</span><b id="filterSkipped">0</b></button>
        </div>
        <div class="evidence-box"><strong>自动写入边界</strong><p>只处理能由文件夹名称和扩展名直接支持的分类。已有标签不会删除或替换。</p></div>
      </aside>

      <section class="queue-panel">
        <header class="queue-head">
          <label><input id="selectVisible" type="checkbox" checked><span>选择当前结果</span></label>
          <span id="visibleCount">0 项</span>
        </header>
        <div class="table-wrap">
          <table>
            <thead><tr><th class="check-cell"></th><th>条目</th><th>证据来源</th><th>预写入标签</th><th>状态</th></tr></thead>
            <tbody id="queueBody"></tbody>
          </table>
          <div id="emptyState" class="empty" hidden><strong>没有匹配条目</strong><span>调整筛选或搜索条件</span></div>
        </div>
      </section>
    </section>
  </main>
  <script src="js/mapping.js"></script>
  <script src="js/plugin.js"></script>
</body>
</html>
